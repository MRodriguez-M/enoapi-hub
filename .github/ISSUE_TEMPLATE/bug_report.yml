name: 🐛 Bug Report
description: Create a report to help us fix an issue or broken functionality
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I click on... X happens instead of Y..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node.js version, etc.
      placeholder: e.g. Chrome 124, Windows 11, Node 20.12.0
